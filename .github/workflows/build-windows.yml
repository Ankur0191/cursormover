name: Build CursorMover for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CursorMover --collect-all customtkinter main.py

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/CursorMover.exe")) { throw "CursorMover.exe was not created" }
          Get-Item "dist/CursorMover.exe" | Format-List Name,Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CursorMover-Windows-EXE
          path: dist/CursorMover.exe
          if-no-files-found: error
          retention-days: 30
